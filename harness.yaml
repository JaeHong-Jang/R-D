project:
  name: "인공지능 활용 온라인 정보 분석 및 검증 서비스 연구"
  host: "지엔소프트(주) 프로젝트형 일경험 (8주, 4인 팀)"
  domain: "politics-news-claim-verification"
  stage: "data-building"        # 주제 확정 → 데이터 구축 → 판정 기준 → 모델 비교 → 프로토타입 → 성능평가
  scope: "정치 뉴스 중 기관 자료로 확인 가능한 주장(법안 발의·통과, 표결 결과, 법령 내용, 헌재 결정)"
  repo: "https://github.com/JaeHong-Jang/R-D (공개 저장소)"
  last_updated: "2026-11-28"

# 폴더 계약. 새 폴더를 만들면 여기에 먼저 적는다.
folders:
  # 1) 산출물 흐름
  "00_제출": "회사·학교에 내는 서류 (활동 계획서, 중간·최종 보고서)"
  "01_전략": "주제·범위 결정, DDBM 캔버스"
  "02_제품": "서비스 정의, 이용 시나리오, 웹 프로토타입 화면 설계"
  "03_에이전트": "신뢰성 판정에 쓰는 LLM 프롬프트와 에이전트 설계"
  "04_아키텍처": "수집 → 정제 → 파싱 → 근거 검색 → 판정 파이프라인, AutoRAG 구성"
  "05_리서치": "날짜가 붙은 리서치 보고서"
  "05_리서치/research_notes": "리서치 갈래별 원본 노트"
  "05_리서치/reports": "리서치 종합 보고서"
  "06_증빙/수집_허용근거": "언론사 robots.txt·AI 이용 금지 문구 점검 기록, API 이용 조건"
  "06_증빙/회의록": "회사 미팅·팀 회의 기록"
  "07_원천/제안서": "지엔소프트 주제 제안서 원본"
  "07_원천/사전교육": "사전교육 자료 원본"
  "08_코칭": "코칭 3회(2주차 NLP·NER, 4주차 파싱·플랫폼 설계, 7주차 성능평가) 준비와 피드백"
  "_체계": "작업 체계 메모"
  # 09~12는 하네스 폴더. 번호 폴더 아래 이름은 코드 import를 위해 영어로 둔다.
  "09_데이터/catalog": "데이터셋 등록부 datasets.yaml (데이터의 단일 기준)"
  "09_데이터/raw": "받은 그대로의 원자료. 출처/데이터셋ID/수집일 폴더로 보관하고 고치지 않는다"
  "09_데이터/interim": "정제 중간 결과 (다시 만들 수 있는 것)"
  "09_데이터/processed": "판정·평가에 쓰는 최종 표, AutoRAG corpus·qa"
  "09_데이터/samples": "저장소에 올리는 소량 표본 (기사 본문 제외)"
  "10_구현/src/collectors": "수집기 (데이터셋 하나당 파일 하나, 출처별 공통 호출 파일 허용)"
  "10_구현/src/pipeline": "raw → interim → processed 변환"
  "10_구현/src/service": "웹 프로토타입 코드"
  "10_구현/scripts": "수집·변환 실행 진입점 (매일 수집: collect_daily.py)"
  "10_구현/tests": "수집기와 변환 검증"
  "10_구현/notebooks": "탐색 분석"
  "10_구현/prompts": "서비스에 들어가는 프롬프트"
  "10_구현/static": "이미지 등 정적 자원"
  "11_실험/experiments": "모델·검색 방식 비교 실험 결과 (저장소 제외)"
  "11_실험/artifacts": "모델 등 생성물 (저장소 제외)"
  "12_기준/docs": "과제 분석, 출처 기록, 변경 기록"
  "12_기준/rules": "데이터 규칙, 수집 준수 규칙"
  "12_기준/evals": "성능평가 기준"

artifacts:
  project_analysis: "12_기준/docs/01_project_analysis.md"
  source_log: "12_기준/docs/00_source-log.md"
  change_log: "12_기준/docs/11_change-log.md"
  dataset_catalog: "09_데이터/catalog/datasets.yaml"
  ddbm_canvas: "01_전략/DDBM_캔버스_초안.md"   # 정치 분야로 좁히기 전 초안. 갱신 필요
  # 아래는 앞으로 작성
  judgment_criteria: "12_기준/docs/02_judgment_criteria.md"   # 거짓·사실 판정 기준 (초안)
  gold_candidates: "09_데이터/processed/gold__candidates.csv"  # 규칙으로 뽑은 후보와 자동 라벨 제안, 사람 라벨 칸 비어 있음
  synthetic_claims: "09_데이터/processed/synthetic__claims.csv"  # 국회 기록으로 만든 템플릿 주장 (학습·개발용)
  gold_set: "09_데이터/processed/gold__claims_evidence.csv"    # 주장-근거 정답셋 (사람이 작성)

rules:
  data: "12_기준/rules/data-rules.md"
  collection: "12_기준/rules/collection-rules.md"

evals:
  rubric: "12_기준/evals/rubric.md"

quality_gates:
  domain_selected: true                    # 정치 (2026-11-26)
  news_collector_working: true             # 언론사 9곳
  assembly_collector_working: true         # 22대 의안 21,299건, 표결 1,918건 (2026-11-28)
  assembly_key_registered: true
  law_collector_working: true              # 현행법령·헌재결정례
  policy_briefing_collector_working: true  # 정책뉴스만. 보도자료는 없음
  daily_schedule_registered: true          # Windows 작업 RnD_뉴스수집_0900·2100 → ~/run_rnd_daily.sh (2026-11-28)
  judgment_criteria_written: false        # 초안 12_기준/docs/02_judgment_criteria.md, 팀 확정 전
  gold_candidates_extracted: true          # 09_데이터/processed/gold__candidates.csv
  synthetic_claims_generated: true         # 09_데이터/processed/synthetic__claims.csv 2,000개, 근거 대조 전수 검증 통과
  gold_set_100_written: false
  candidate_models_compared: false
  prototype_working: false
  evaluation_reported: false               # Accuracy·Precision·Recall·F1, 오탐·미탐

risks:
  - id: "R-001"
    status: "open"
    risk: "기사 본문은 언론사 저작권물이다. 공개 저장소에 올리면 문제가 된다."
    control: "09_데이터/raw·interim·processed는 .gitignore로 제외. samples에도 본문은 넣지 않는다."
  - id: "R-002"
    status: "open"
    risk: "한겨레·중앙일보·노컷뉴스는 robots.txt에서 AI 봇(GPTBot 등)을 막는다. 일반 크롤러는 허용한다."
    control: "회사 담당자에게 포함 여부를 확인한다. 빼야 하면 news_press.py SITES에서 지운다."
  - id: "R-003"
    status: "open"
    risk: "법제처 API는 등록한 IP에서만 호출된다. 가정용 회선은 IP가 바뀐다."
    control: "인증 실패 메시지가 나오면 open.law.go.kr 마이페이지에서 IP를 다시 등록한다."
  - id: "R-004"
    status: "open"
    risk: "정책브리핑 보도자료 전용 API가 공공데이터포털에서 사라졌다. 정책뉴스 API에는 보도자료가 없다(2026-11-26~27 확인, 모두 policy)."
    control: "정부 발표 근거는 정책뉴스로 대신한다. 보도자료 원문이 꼭 필요하면 부처별 보도자료 API를 따로 찾는다."
  - id: "R-005"
    status: "open"
    risk: "포괄적 뉴스는 성능이 떨어진다(회사 미팅). 정치 기사 대부분은 의견·전망이라 기관 자료로 판정할 수 없다."
    control: "판정 대상을 기관 자료로 확인 가능한 주장으로 한정하고, 나머지는 '판정 불가'로 분류한다."

decisions:
  - id: "D-005"
    date: "2026-11-28"
    decision: "정답셋을 둘로 나눈다. 학습·개발용은 국회 기록으로 자동 생성하고, 최종 평가용은 기사 문장 100개를 사람이 검수한다."
    rationale: "공개된 한국어 정치 팩트체크 정답셋이 없다. 자동 생성 문장은 기사 말투와 달라 최종 성능 보고에는 쓰지 않는다."
  - id: "D-001"
    date: "2026-11-26"
    decision: "분야를 정치로 한다."
    rationale: "회사 미팅에서 포괄적 뉴스는 성능이 떨어지니 분야를 좁히라는 조언."
  - id: "D-002"
    date: "2026-11-26"
    decision: "네이버·다음 뉴스는 수집하지 않고, 수집이 허용된 언론사 9곳에서 직접 받는다."
    rationale: "두 포털은 robots.txt로 전면 금지하고 네이버는 AI 학습·RAG 목적 수집을 명시적으로 금지한다."
  - id: "D-003"
    date: "2026-11-27"
    decision: "AutoRAG는 근거 자료와 정답셋이 쌓인 뒤 6~7주차 모델 비교 단계에서 쓴다."
    rationale: "AutoRAG는 corpus와 qa 정답셋이 있어야 돌아간다. 뉴스는 질문 쪽이고 근거 자료는 기관 데이터다."
  - id: "D-004"
    date: "2026-11-28"
    decision: "서울 야간경제 해커톤 하네스와 같은 폴더 체계를 쓴다. 본선 폴더 자리는 08_코칭으로 바꾼다."
    rationale: "데이터 출처 추적과 수집기·변환 코드 분리가 이 과제에도 그대로 필요하다."

open_questions:
  - id: "Q-001"
    question: "거짓 뉴스 판단 기준을 무엇으로 할 것인가? (사실 / 거짓 / 일부 사실 / 판정 불가 등 등급)"
    owner: "팀"
  - id: "Q-002"
    question: "제안서의 세대·성별 갈등 표현 분석과 NER 요구를 정치 주장 검증과 어떻게 묶을 것인가?"
    owner: "팀 (2주차 코칭에서 확인)"
  - id: "Q-003"
    question: "한겨레·중앙일보·노컷뉴스 수집을 계속해도 되는가?"
    owner: "회사 담당자"
  - id: "Q-004"
    question: "프로젝트 시작일과 코칭 날짜는? (주차 계산 기준)"
    owner: "팀"
